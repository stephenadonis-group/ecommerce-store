apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: novastore-backend
  namespace: monitoring
  labels:
    release: kps
spec:
  namespaceSelector:
    matchNames:
      - novastore
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s