apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "novastore.labels" . | nindent 4 }}
    app: frontend
spec:
  type: {{ .Values.frontend.serviceType }}
  selector:
    app: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      {{- if and (eq .Values.frontend.serviceType "NodePort") .Values.frontend.nodePort }}
      nodePort: {{ .Values.frontend.nodePort }}
      {{- end }}