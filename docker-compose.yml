services:
  mysql:
    image: mysql:8
    container_name: novastore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root #use .env to pass env variables in production
      MYSQL_DATABASE: novastore #use .env to pass env variables in production
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - novastore

  backend:
    image: novastore-backend:latest
    container_name: novastore-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/novastore  #use .env to pass env variables in production
      DB_USERNAME: root #use .env to pass env variables in production
      DB_PASSWORD: root #use .env to pass env variables in production
      # Optional: set your own secret; omit to use the app default
      # JWT_SECRET: "your-base64-secret"
      PORT: "8080"
    ports:
      - "8080:8080"
    networks:
      - novastore

  frontend:
    image: novastore-frontend:latest
    container_name: novastore-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - novastore

volumes:
  mysql_data:

networks:
  novastore:
    driver: bridge