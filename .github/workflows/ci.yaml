name: NovaStore CI/CD — Docker Hub and Argo CD securityScanning
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "helm/novastore/**"
      - ".github/workflows/ci.yaml"
      - "scripts/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "helm/novastore/**"
      - ".github/workflows/ci.yaml"
      - "scripts/**"
concurrency:
  group: novastore-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # ---------- Security scans (SAST / secrets / JS deps) ----------
  security-scans:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Gitleaks JSON report
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest \
            detect --source /path --verbose -f json -r /path/gitleaks.json \
            || true
          test -f gitleaks.json || echo '[]' > gitleaks.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retire.js
        continue-on-error: true
        run: |
          npm install -g retire
          if [ -d frontend ]; then
            (cd frontend && npm ci --ignore-scripts || npm install --ignore-scripts || true)
            retire --path frontend --outputformat json --outputpath retire.json || true
          else
            retire --path . --outputformat json --outputpath retire.json || true
          fi
          test -f retire.json || echo '[]' > retire.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: njsscan
        continue-on-error: true
        run: |
          pip install --upgrade pip njsscan
          njsscan --exit-warning . --sarif -o njsscan.sarif || true
          test -f njsscan.sarif || echo '{"runs":[]}' > njsscan.sarif
      - name: Semgrep
        continue-on-error: true
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/javascript
      - name: Semgrep JSON (CLI)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep \
            semgrep scan \
              --config p/java \
              --config p/javascript \
              --json \
              --output /src/semgrep.json \
              /src || true
          test -f semgrep.json || echo '{}' > semgrep.json
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks.json
            njsscan.sarif
            semgrep.json
            retire.json
          if-no-files-found: warn

  # ---------- Build + Trivy + push ----------
  build:
    name: Build and scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: novastore-backend
          - service: frontend
            image: novastore-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compute image tags
        id: vars
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: |
            stephenadonis/${{ matrix.image }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Trivy table (console)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: stephenadonis/${{ matrix.image }}:${{ steps.vars.outputs.sha }}
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
      - name: Trivy JSON for DefectDojo
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: stephenadonis/${{ matrix.image }}:${{ steps.vars.outputs.sha }}
          format: json
          output: trivy-${{ matrix.service }}.json
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.json
          if-no-files-found: warn
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            stephenadonis/${{ matrix.image }}:${{ steps.vars.outputs.sha }}
            stephenadonis/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

  # ---------- Upload to DefectDojo ----------
  upload-defectdojo:
    name: Upload reports to DefectDojo
    runs-on: ubuntu-latest
    needs: [security-scans, build]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout (for upload script)
        uses: actions/checkout@v4
      - name: Download security reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: reports
        continue-on-error: true
      - name: Download Trivy backend
        uses: actions/download-artifact@v4
        with:
          name: trivy-backend
          path: reports
        continue-on-error: true
      - name: Download Trivy frontend
        uses: actions/download-artifact@v4
        with:
          name: trivy-frontend
          path: reports
        continue-on-error: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: pip install requests
      - name: Upload to DefectDojo
        env:
          DEFECTDOJO_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ vars.DEFECTDOJO_ENGAGEMENT_ID || secrets.DEFECTDOJO_ENGAGEMENT_ID }}
          DEFECTDOJO_URL: ${{ vars.DEFECTDOJO_URL || 'https://demo.defectdojo.org/api/v2/import-scan/' }}
        working-directory: reports
        run: |
          set -euo pipefail
          cp ../scripts/upload-report.py .
          for f in gitleaks.json semgrep.json njsscan.sarif retire.json \
                   trivy-backend.json trivy-frontend.json trivy.json; do
            if [ -f "$f" ]; then
              python3 upload-report.py "$f" || true
            else
              echo "Skipping missing report: $f"
            fi
          done

  # ---------- GitOps tag update ----------
  update-gitops:
    name: Update Helm image tags
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITOPS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Compute image tag
        id: vars
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Install yq
        run: |
          sudo wget -q \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Update Helm image references
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          FILE="helm/novastore/values.yaml"
          yq -i ".images.backend = \"stephenadonis/novastore-backend:${NEW_TAG}\"" "$FILE"
          yq -i ".images.frontend = \"stephenadonis/novastore-frontend:${NEW_TAG}\"" "$FILE"
          yq '.images' "$FILE"
      - name: Commit GitOps change
        env:
          NEW_TAG: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "novastore-ci[bot]"
          git config user.email "novastore-ci[bot]@users.noreply.github.com"
          if git diff --quiet -- helm/novastore/values.yaml; then
            echo "No Helm image changes to commit."
            exit 0
          fi
          git add helm/novastore/values.yaml
          git commit -m "ci(gitops): update images to ${NEW_TAG} [skip ci]"
          git push origin main